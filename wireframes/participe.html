<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe: Participe</title>
<link rel="stylesheet" href="wf.css">
<script src="wf.js" defer></script>
</head>
<body data-menu="Participe">

<header class="wf-topo">
  <h1>Participe</h1>
  <p>Quem pode entrar, como funciona a seleção, o que se espera do membro, modelos para autores e contato. Texto de conteudo/textos-base.md, seção 3. Estado mostrado: seleção fechada (o mais comum), com a versão aberta como alternativa.</p>
</header>

<template id="tela">
  <div data-g1></div>

  <div class="lim">
    <section class="b">
      <p class="nota"><b>PA1</b> título + quem pode entrar.</p>
      <p class="t1">Participe</p>
      <p class="t3">Quem pode entrar</p>
      <p>A liga reúne estudantes de graduação da UFRGS pertencentes a qualquer curso. Todos aqueles que desejam aprender sobre Macroeconomia são livres para participar, mas conhecimento prévio de macroeconomia ajuda a acompanhar as discussões. Não é preciso já saber escrever um texto acadêmico. Os textos passam por debate entre pares e por revisão docente justamente para que todos aprendam no processo.</p>
    </section>

    <div class="g2">
      <section class="b">
        <p class="nota"><b>PA2</b> seleção: como funciona + situação atual (aberta ou fechada). Com seleção aberta, o botão de inscrição sobe para logo abaixo de PA1.</p>
        <p class="t2">Como funciona a seleção</p>
        <p>As vagas abrem por processo seletivo periódico. A inscrição é feita por formulário on-line. Divulgamos as datas aqui e no Instagram.</p>
        <p style="border:1px solid #999; padding:10px">Não há processo seletivo aberto agora. Siga @macroliga.ufrgs para saber do próximo.</p>
        <div class="alt"><span class="rot">Com seleção aberta:</span>Inscrições abertas até [data].<div class="btns"><span class="btn prim">Fazer inscrição no processo seletivo</span></div></div>
      </section>

      <section class="b">
        <p class="nota"><b>PA3</b> o que se espera do membro: lista curta.</p>
        <p class="t2">O que se espera do membro</p>
        <ul>
          <li>Escrever textos para os fascículos, dentro de um dos eixos ligados à Macroeconomia.</li>
          <li>Ler e debater os textos dos colegas antes da revisão docente.</li>
          <li>Participar das reuniões da liga.</li>
          <li>Atuar nas atividades que garantam a manutenção e expansão institucional da liga.</li>
          <li>Membros recebem certificados de horas de extensão por sua participação nas atividades da liga.</li>
        </ul>
      </section>
    </div>

    <section class="b">
      <p class="nota"><b>PA4</b> modelos para autores: frase + dois downloads (Word e LaTeX).</p>
      <p class="t2">Modelos para autores</p>
      <p>Use os modelos para escrever no formato dos fascículos: com título, autor, eixo e tipo de texto.</p>
      <div class="btns"><span class="btn">Baixar modelo em Word</span><span class="btn">Baixar modelo em LaTeX</span></div>
    </section>

    <section class="b">
      <p class="nota"><b>PA5</b> contato: e-mail e redes, para dúvidas sobre a seleção. Repete o rodapé de propósito: aqui é onde a pergunta surge.</p>
      <p class="t3">Dúvidas?</p>
      <p>macroliga.ufrgs@gmail.com</p>
      <div class="btns"><span class="btn">Escrever para a liga</span><span class="btn">Seguir no Instagram</span></div>
    </section>
  </div>

  <div data-g2></div>
</template>
</body>
</html>
