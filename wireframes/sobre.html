<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe: Sobre</title>
<link rel="stylesheet" href="wf.css">
<script src="wf.js" defer></script>
</head>
<body data-menu="Sobre">

<header class="wf-topo">
  <h1>Sobre</h1>
  <p>Missão, como funcionamos (as 4 etapas), eixos, regra da pluralidade e vínculo com a extensão. Todo o texto vem de conteudo/textos-base.md, seção 2.</p>
</header>

<template id="tela">
  <div data-g1></div>

  <div class="lim">
    <section class="b">
      <p class="nota"><b>S1</b> título + missão. No desktop, o selo da liga ao lado.</p>
      <div class="g-lado">
        <div>
          <p class="t1">Sobre a liga</p>
          <p class="t3">Missão</p>
          <p>A MacroLiga, um projeto idealizado e criado pelos alunos e alunas de Ciências Econômicas da Universidade Federal do Rio Grande do Sul, tem como objetivo a integração entre a teoria e prática científica e profissional na área da Macroeconomia. Por meio da elaboração e debate coletivo da produção científica, busca-se criar um ambiente propício para o domínio das competências necessárias ao exercício da profissão de economista.</p>
        </div>
        <div class="img so-d" style="aspect-ratio:1/1"><span>selo da liga</span></div>
      </div>
    </section>

    <section class="b">
      <p class="nota"><b>S2</b> como funcionamos: as 4 etapas em sequência (numeração real). No celular, uma embaixo da outra; no desktop, em linha.</p>
      <p class="t2">Como funcionamos</p>
      <p>Todo texto passa pelas mesmas quatro etapas.</p>
      <div class="g4">
        <div style="border-top:2px solid #444; padding-top:8px"><p class="t3">1. Texto</p><p class="peq">Um membro escreve sobre um dos temas associados à macroeconomia. Nossos textos baseiam-se em análise de conjuntura, revisão de literatura, nota de pesquisa ou texto de opinião.</p></div>
        <div style="border-top:2px solid #444; padding-top:8px"><p class="t3">2. Debate entre pares</p><p class="peq">Os membros leem e discutem o texto antes da revisão. A discussão testa os dados, os argumentos e a clareza.</p></div>
        <div style="border-top:2px solid #444; padding-top:8px"><p class="t3">3. Revisão docente</p><p class="peq">Um professor revisa o texto, garantindo a qualidade acadêmica do texto.</p></div>
        <div style="border-top:2px solid #444; padding-top:8px"><p class="t3">4. Publicação</p><p class="peq">Os textos aprovados formam um fascículo numerado. Cada texto recebe um DOI no Zenodo. O DOI é um identificador permanente: o link não quebra e o texto pode ser citado em trabalhos acadêmicos. Cada fascículo é lançado em um evento presencial na FCE, com um debatedor para cada texto.</p></div>
      </div>
    </section>

    <div class="g2">
      <section class="b">
        <p class="nota"><b>S3</b> nossos eixos: os 6, cada um com link para Publicações já filtrada por ele.</p>
        <p class="t2">Nossos eixos</p>
        <div class="item"><u>Política monetária e inflação</u></div>
        <div class="item"><u>Setor externo e câmbio</u></div>
        <div class="item"><u>Atividade econômica, mercado de trabalho e crédito</u></div>
        <div class="item"><u>Política fiscal e contas públicas</u></div>
        <div class="item"><u>Mercados externos</u></div>
        <div class="item"><u>Conjuntura política</u></div>
      </section>

      <section class="b escuro">
        <p class="nota"><b>S4</b> regra da pluralidade: bloco em destaque (fundo em bloco), porque é o compromisso central da voz da liga.</p>
        <p class="t2">Regra da pluralidade</p>
        <p>A liga não toma posição sobre política econômica, governos ou partidos. Nossos membros têm visões teóricas diferentes, e isso faz parte do projeto. Criamos textos baseados em fatos. Eles mostram o que aconteceu, com número, data e fonte. A opinião de cada autor é de sua responsabilidade única e aparece só em seus textos individuais, assinados e identificados.</p>
      </section>
    </div>

    <section class="b">
      <p class="nota"><b>S5</b> vínculo com a extensão: modalidade, coordenação, o que é extensão e por que há questionário. No celular, o selo entra aqui.</p>
      <div>
        <div class="img so-c" style="aspect-ratio:1/1; max-width:120px; margin-bottom:12px"><span>selo</span></div>
        <div>
          <p class="t2">Vínculo com a extensão</p>
          <p>A MacroLiga UFRGS é um projeto de extensão da Faculdade de Ciências Econômicas (FCE) da UFRGS, na modalidade Produção e Publicação. A coordenação é do prof. Leonardo Xavier da Silva.</p>
          <p>Extensão universitária é a atividade que leva à comunidade o conhecimento produzido na universidade. Por isso, todos os textos do site são abertos e gratuitos. Ao fim de cada texto e de cada fascículo, há um questionário curto. As respostas ajudam a avaliar o projeto.</p>
          <div class="btns"><span class="btn">Ver a equipe</span><span class="btn">Ver as publicações</span></div>
        </div>
      </div>
    </section>
  </div>

  <div data-g2></div>
</template>
</body>
</html>
