<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe: Início A</title>
<link rel="stylesheet" href="wf.css">
<script src="wf.js" defer></script>
</head>
<body data-menu="Início">

<header class="wf-topo">
  <h1>Início, alternativa A: abre pelo fascículo</h1>
  <p>A primeira tela é o fascículo mais recente. A apresentação da liga cabe em uma faixa curta acima dele. Funciona para quem chega pelo post de lançamento no Instagram. Mostra o estado depois de 27/11; o estado "em breve" está no bloco I2.</p>
</header>

<template id="tela">
  <div data-g1></div>

  <div class="lim">
    <section class="b">
      <p class="nota"><b>I1</b> abertura em uma faixa: frase + subtítulo. Curta, para o fascículo aparecer sem rolar no celular.</p>
      <p class="t2">A conjuntura brasileira, explicada pela teoria.</p>
      <p class="peq">Somos a Liga Acadêmica de Macroeconomia da UFRGS. Buscamos promover o ensino e o debate da macroeconomia e seus impactos.</p>
    </section>

    <section class="b">
      <p class="nota"><b>I2</b> fascículo mais recente (bloco principal): capa + número e data + sumário + botões. No celular, "Ler o fascículo" aparece antes do sumário.</p>
      <div class="g-capa">
        <div class="img capa"><span>capa do fascículo nº 1</span></div>
        <div>
          <p class="meta">Fascículo mais recente</p>
          <p class="t1">[Pontos de Macro] nº 1</p>
          <p>27 de novembro de 2026. 4 textos sobre a economia brasileira, revisados por professores da FCE.</p>
          <div class="btns so-c"><span class="btn prim">Ler o fascículo</span></div>
          <p class="t3" style="margin-top:16px">Sumário</p>
          <div class="item"><b>Endividamento das famílias e financeirização no Brasil</b><br><span class="meta">João Pedone</span></div>
          <div class="item"><b>Impactos setoriais do acordo Mercosul e União Europeia</b><br><span class="meta">Miguel Amorin</span></div>
          <div class="item"><b>Notas sobre a eficácia da política monetária sob a hipótese de expectativas racionais: uma breve revisão da literatura</b><br><span class="meta">Gabriel Vieira</span></div>
          <div class="item"><b>Subdesenvolvimento: uma visão schumpeteriana</b><br><span class="meta">Arthur Pittella</span></div>
          <div class="btns"><span class="btn prim so-d">Ler o fascículo</span><span class="btn">Ver todos os fascículos</span></div>
        </div>
      </div>
      <div class="alt">
        <span class="rot">Estado até o lançamento (site de 18/10):</span>
        <b>Fascículo nº 1: em breve.</b> O primeiro fascículo está em produção. O lançamento será em um evento presencial na FCE, em data a ser confirmada. A capa vira um espaço reservado; o sumário continua igual, sem links.
        <div class="btns"><span class="btn">Seguir @macroliga.ufrgs para saber do lançamento</span></div>
      </div>
    </section>

    <div class="g2">
      <section class="b">
        <p class="nota"><b>I3</b> gráfico comentado mais recente: gráfico + título-afirmação + botão. Opcional na 1ª versão (decisão 4).</p>
        <p class="meta">Gráfico comentado</p>
        <svg class="grafico" viewBox="0 0 600 300" role="img" aria-label="Esboço de gráfico de linha">
          <g stroke="#ddd"><line x1="40" y1="60" x2="580" y2="60"/><line x1="40" y1="120" x2="580" y2="120"/><line x1="40" y1="180" x2="580" y2="180"/><line x1="40" y1="240" x2="580" y2="240"/></g>
          <polyline fill="none" stroke="#555" stroke-width="3" points="40,220 100,210 160,215 220,190 280,180 340,170 400,140 460,120 520,110 570,90"/>
          <circle cx="570" cy="90" r="8" fill="#222"/>
        </svg>
        <p class="t3" style="margin-top:10px">Juros já pesam 10% da renda das famílias <span class="peq">(título de exemplo)</span></p>
        <p class="peq">Um gráfico, um comentário de até 150 palavras e a fonte dos dados.</p>
        <div class="btns"><span class="btn">Ler o comentário</span><span class="btn">Ver todos os gráficos</span></div>
        <div class="alt"><span class="rot">Sem gráfico publicado:</span>O primeiro gráfico comentado ainda não saiu. Siga @macroliga.ufrgs para ver quando for publicado.</div>
      </section>

      <section class="b">
        <p class="nota"><b>I4</b> próximo evento: nome + data, horário e local + inscrição.</p>
        <p class="meta">Próximo evento</p>
        <p class="t2">Lançamento do fascículo nº 1</p>
        <p>Semana de 23/11/2026 (data a confirmar), [horário], FCE/UFRGS.</p>
        <div class="btns"><span class="btn prim">Fazer inscrição</span></div>
        <div class="alt"><span class="rot">Sem evento agendado:</span>Nenhum evento agendado. Siga @macroliga.ufrgs para saber do próximo.</div>
      </section>
    </div>

    <section class="b">
      <p class="nota"><b>I5</b> redes: frase + dois botões. É o caminho de volta para quem veio do Instagram.</p>
      <p class="t3">Acompanhe a liga</p>
      <p>Estamos no Instagram e no LinkedIn debatendo sobre macroeconomia e divulgando informações sobre a MacroLiga.</p>
      <div class="btns"><span class="btn">Seguir no Instagram</span><span class="btn">Seguir no LinkedIn</span></div>
    </section>
  </div>

  <div data-g2></div>
</template>
</body>
</html>
