# Membros da liga. Atualize a cada gestão (veja o LEIA-ME, seção 7.9).
# A página mostra, nesta ordem: Conselho Executivo, Membros e Membros fundadores.
#
# conselho:   quem está no Conselho Executivo nesta gestão.
#             genero: "feminino" ou "masculino" (define "Conselheira" ou "Conselheiro").
#             presidente: true em uma só pessoa (aparece como "Presidente"); false nas demais.
# membros:    quem está na liga nesta gestão e não está no conselho. Ninguém aparece nos dois.
# fundadores: as pessoas que criaram a liga. Lista fixa: nunca apague ninguém daqui,
#             mesmo depois que a pessoa sair da liga. Por isso um nome pode se repetir
#             entre os fundadores e o conselho ou os membros.
#
# foto: deixe vazio até haver termo de uso de imagem (decisão 5 do CLAUDE.md).
#       Depois, ponha a foto quadrada em assets/equipe/ e escreva o caminho, ex.: "assets/equipe/nome.jpg".
conselho:
  - { nome: "[a preencher]", genero: "feminino", presidente: true, foto: "" }
  - { nome: "[a preencher]", genero: "masculino", presidente: false, foto: "" }
  - { nome: "[a preencher]", genero: "feminino", presidente: false, foto: "" }
  - { nome: "[a preencher]", genero: "masculino", presidente: false, foto: "" }
membros:
  - { nome: "[a preencher]", foto: "" }
  - { nome: "[a preencher]", foto: "" }
  - { nome: "[a preencher]", foto: "" }
  - { nome: "[a preencher]", foto: "" }
  - { nome: "[a preencher]", foto: "" }
  - { nome: "[a preencher]", foto: "" }
fundadores:
  - { nome: "[a preencher]", foto: "" }
  - { nome: "[a preencher]", foto: "" }
  - { nome: "[a preencher]", foto: "" }
  - { nome: "[a preencher]", foto: "" }
  - { nome: "[a preencher]", foto: "" }
